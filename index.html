<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f2546">
  <title>Hidd el, én vagyok! — időutazó beszélgetőjáték</title>
  <meta name="description" content="Telefonálj a régi önmagadnak, és meséld el, mi történt azóta. Egyszemélyes elmélkedő út és társasjáték egy böngészőben.">
  <meta property="og:title" content="Hidd el, én vagyok!">
  <meta property="og:description" content="Időutazó beszélgetőjáték: két évszám, egy telefonhívás, és a régi éned, aki nem hisz neked.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scenery" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <button id="soundToggle" class="sound" type="button" aria-pressed="false" aria-label="Zene bekapcsolása">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor"/>
      <path class="wave w1" d="M15 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path class="wave w2" d="M17.6 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path class="mute" d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <main id="app" tabindex="-1"></main>
  <div id="toast-layer" aria-live="polite"></div>

  <noscript><p class="noscript">A játékhoz engedélyezni kell a JavaScriptet.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/capsule.js"></script>
  <script src="js/solo.js"></script>
  <script src="js/party.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
